<h2 class="text-center">Contact and links</h2>

@if( contacts$ | async; as contacts ) {
<div class="container pb-5 mb-5">
  <div class="row">
  @for( item of contacts; track item.link ){
    <div class="col-4 d-flex justify-content-center align-items-center display-3">
      <a [href]="item.link" target="_blank">
        <i [class]="item.logo"  [style.color]="item.color"> </i>
      </a>
    </div>
  }
  </div>
</div>
} @else {
<div>Chargement des liens...</div>
}
