- title: Roguelike
  context: Université Gustave Eiffel
  status: Terminé
  image: assets/images/projects/RogueLike.png
  date: Octobre 2021 - Décembre 2021
  technologies: [C, Git, MVL graphic Library]
  links:
    - https://github.com/Setsulys/Rogue-like
  description:
    - Jeu roguelike, avec des étages de labyrinthes tous différents généré procéduralement, sur chaque étage se trouve des énemis et des coffres contenant des bonus, comme une armure, une epee, des potions, etc
    - Le joueur devra donc parcourir un maximum d'étages et bien s'équiper pour pouvoir y parvenir.
    - Génération procédurale du labyrinthe
    - Ajout et utilisation de la librairie graphique MLV dérivé de SDL
    - Ajout d'une procédure de sauvegarde de partie et de chargement de partie
    - Ajout de Musique et d'easter Egg et de pseudo animations


